<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Plugins Mgr :4002</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent }
    .tab, .shut, .card, .card-btn, .modal-footer .btn, .sort-btn, .close, #confirmOk, #confirmCancel { -webkit-tap-highlight-color: transparent }
    :root {
      --bg: #06060e; --s1: #0c0c1a; --bd: #1a1a35;
      --ac: #0070ff; --ac2: #00bbff; --gl: rgba(0,112,255,.15);
      --tx: #d0d0e4; --dm: #505068;
      --ok: #00dd77; --er: #ff2244; --lb: #040408;
      --indigo-glow: rgba(80,50,180,.28); --indigo-light: #a78bfa;
      --cyan-dim: rgba(0,210,255,.15); --cyan: #38bdf8;
      --tr: #fbbf24; --tr-dim: rgba(251,191,36,.15);
    }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: radial-gradient(ellipse at 10% 40%, #0c1424, var(--bg) 65%);
      color: var(--tx); height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    ::-webkit-scrollbar { width: 5px }
    ::-webkit-scrollbar-track { background: transparent }
    ::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 3px }
    nav {
      height: 48px; background: var(--s1);
      border-bottom: 1px solid var(--bd);
      display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
      flex-shrink: 0; position: relative;
    }
    nav::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--ac), transparent); opacity: .3;
    }
    .logo {
      font-size: 14px; font-weight: 800; letter-spacing: 3px;
      text-transform: uppercase; margin-right: 12px;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .logo .version {
      font-size: 10px; font-weight: 500; color: var(--dm);
      letter-spacing: 0.5px; text-transform: none;
      background: none; -webkit-text-fill-color: var(--dm);
      margin-left: 4px;
    }
    .tab {
      background: none; border: 1px solid transparent; color: var(--dm);
      font-size: 11px; font-weight: 600; padding: 5px 14px;
      cursor: pointer; border-radius: 16px; transition: all .2s;
      letter-spacing: .5px; text-transform: uppercase;
    }
    .tab:hover { color: var(--tx); border-color: var(--bd) }
    .tab.active {
      color: #fff; background: var(--ac); border-color: var(--ac);
      box-shadow: 0 0 12px var(--gl);
    }
    .mobile-filter-btn {
      display: none;
      background: var(--ac); border: 1px solid var(--ac); color: #fff;
      font-size: 11px; font-weight: 600; padding: 5px 14px;
      cursor: pointer; border-radius: 16px; transition: all .2s;
      letter-spacing: .5px; text-transform: uppercase;
      box-shadow: 0 0 12px var(--gl);
    }
    .spacer { flex: 1 }
    .status {
      font-size: 11px; color: var(--dm); letter-spacing: .5px;
    }
    .status span { color: var(--tx); font-weight: 600 }
    .shut {
      background: none; border: 1px solid var(--er); color: var(--er);
      padding: 5px 12px; border-radius: 16px; cursor: pointer;
      font-size: 10px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase; transition: all .2s;
    }
    .shut:hover { background: var(--er); color: #fff }
    .shut svg, .card-btn svg, .modal-footer .btn svg {
      width: 16px; height: 16px;
      display: inline-block; vertical-align: middle;
      pointer-events: none;
    }
    .filter-bar {
      height: 44px; background: var(--s1);
      border-bottom: 1px solid var(--bd);
      display: flex; align-items: center;
      padding: 0 20px; gap: 10px;
      flex-shrink: 0;
    }
    .filter-bar label {
      font-size: 10px; font-weight: 700; color: var(--dm);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .filter-bar select {
      background: var(--bg); border: 1px solid var(--bd); color: var(--tx);
      padding: 4px 10px; border-radius: 8px; font-size: 12px;
      cursor: pointer; outline: none; width: 100%; max-width: 300px;
    }
    .filter-bar select:focus { border-color: var(--ac) }
    .filter-bar input[type=text] {
      background: var(--bg); border: 1px solid var(--bd); color: var(--tx);
      padding: 4px 10px; border-radius: 8px; font-size: 12px;
      outline: none; width: 100%; max-width: 180px;
    }
    .filter-bar input[type=text]:focus { border-color: var(--ac) }
    .sort-btn {
      background: var(--bg); border: 1px solid var(--bd); color: var(--tx);
      padding: 4px 10px; border-radius: 8px; font-size: 12px;
      cursor: pointer; outline: none; transition: all .2s;
      font-family: monospace; min-width: 32px;
    }
    .sort-btn:hover { border-color: var(--ac); color: var(--ac) }
    .trophy-btn {
      background: var(--tr-dim); border: 1px solid var(--tr); color: var(--tr);
      padding: 4px 10px; border-radius: 8px; font-size: 12px;
      cursor: pointer; outline: none; transition: all .2s;
      display: flex; align-items: center; justify-content: center;
      min-width: 32px; box-shadow: 0 0 12px var(--tr-dim);
    }
    .trophy-btn svg {
      width: 16px; height: 16px; display: block;
      pointer-events: none; fill: currentColor;
    }
    .trophy-btn:hover { background: rgba(251,191,36,.25); }
    .trophy-btn.active {
      color: var(--dm); background: var(--bg);
      border-color: var(--bd); box-shadow: none;
    }
    .filter-bar .count {
      font-size: 11px; color: var(--dm); margin-left: auto;
    }
    .filter-bar .count span { color: var(--tx); font-weight: 600 }
    .view-toggle { display: flex; gap: 4px }
    .view-toggle .sort-btn.active { border-color: var(--ac); color: #fff; background: var(--ac) }
    .sel-bar {
      height: 40px; background: var(--s1);
      border-bottom: 1px solid var(--bd);
      display: none; align-items: center; gap: 10px;
      padding: 0 20px; flex-shrink: 0;
    }
    .sel-bar.show { display: flex }
    .sel-bar .count-label {
      font-size: 11px; font-weight: 600; color: var(--tx);
      letter-spacing: .5px; text-transform: uppercase;
    }
    .sel-bar .count-label span { color: var(--ac) }
    .sel-bar .sort-btn.dl { border-color: var(--ac); color: var(--ac) }
    .sel-bar .sort-btn.dl:hover { background: var(--ac); color: #fff }
    .sel-bar .sort-btn.del { border-color: var(--er); color: var(--er) }
    .sel-bar .sort-btn.del:hover { background: var(--er); color: #fff }
    .sel-bar .clear { margin-left: auto }
    .list { display: none }
    .gallery.list-mode .grid { display: none }
    .gallery.list-mode .list { display: block }
    .list-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--s1); border: 1px solid var(--bd);
      border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
      cursor: pointer; transition: all .2s;
    }
    .list-row:hover { border-color: var(--ac); box-shadow: 0 0 12px var(--gl) }
    .list-row.selected { border-color: var(--ac); box-shadow: 0 0 12px var(--gl) }
    .row-check { width: 15px; height: 15px; cursor: pointer; accent-color: var(--ac); flex-shrink: 0 }
    .card .sel-box {
      position: absolute; top: 6px; left: 6px; z-index: 2;
      width: 15px; height: 15px; cursor: pointer; accent-color: var(--ac);
    }
    .card.selected { border-color: var(--ac); box-shadow: 0 0 12px var(--gl) }
    .row-icon { width: 26px; height: 26px; color: var(--dm); flex-shrink: 0 }
    .row-icon svg { width: 100%; height: 100%; stroke: var(--dm); fill: none; stroke-width: 1.5; display: block; pointer-events: none }
    .list-row.enabled .row-icon svg { stroke: var(--ac2); filter: drop-shadow(0 0 8px var(--gl)) }
    .row-name { flex: 1; min-width: 0 }
    .row-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .row-sub { font-size: 10px; color: var(--dm); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .row-meta { font-size: 10px; color: var(--dm); text-align: right; flex-shrink: 0 }
    .row-actions { display: flex; gap: 6px; flex-shrink: 0 }
    .card-btn.del svg { width: 14px; height: 14px }
    .gallery {
      flex: 1; overflow-y: auto; padding: 16px 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--s1); border: 1px solid var(--bd);
      border-radius: 10px; overflow: hidden;
      cursor: pointer; transition: all .2s;
      position: relative;
    }
    .card:hover {
      border-color: var(--ac);
      box-shadow: 0 0 16px var(--gl);
      transform: translateY(-2px);
    }
    .card-thumb {
      width: 100%; aspect-ratio: 16/9;
      background: var(--bg); display: flex;
      align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .card-thumb .placeholder {
      color: var(--dm); font-size: 32px;
    }
    .card-thumb svg { width: 44px; height: 44px; stroke: var(--dm); fill: none; stroke-width: 1.5; }
    .card.enabled .card-thumb svg { stroke: var(--ac2); filter: drop-shadow(0 0 8px var(--gl)); }
    .trophy-inline { margin-right: 4px; }
    .trophy-inline img,
    .trophy-inline svg {
      height: 1em; width: auto;
      vertical-align: middle;
      display: inline;
      pointer-events: none;
    }
    .type-badge {
      display: inline-block;
      font-size: 9px; font-weight: 700;
      padding: 1px 5px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: .5px;
      margin-right: 4px; vertical-align: middle;
    }
    .type-badge.video { background: var(--indigo-glow); color: var(--indigo-light); }
    .type-badge.photo { background: var(--cyan-dim); color: var(--cyan); }
    .type-badge.on { background: rgba(0,221,119,.15); color: var(--ok); }
    .type-badge.off { background: rgba(255,34,68,.15); color: var(--er); }
    .card-info {
      padding: 10px 12px;
    }
    .card-title {
      font-size: 12px; font-weight: 600; color: var(--tx);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 10px; color: var(--dm); margin-top: 3px;
      display: flex; justify-content: space-between;
    }
    .card-actions {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .card-btn {
      flex: 1; padding: 5px 0; border: 1px solid var(--bd);
      background: none; color: var(--dm); font-size: 10px;
      font-weight: 600; border-radius: 6px; cursor: pointer;
      text-transform: uppercase; letter-spacing: .5px;
      transition: all .2s;
    }
    .card-btn:hover { border-color: var(--ac); color: var(--ac) }
    .card-btn.dl { border-color: var(--ac); color: var(--ac) }
    .card-btn.dl:hover { background: var(--ac); color: #fff }
    .card-btn.del { border-color: var(--er); color: var(--er) }
    .card-btn.del:hover { background: var(--er); border-color: var(--er); color: #fff }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.85); z-index: 1000;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex }
    #confirmModal {
      position: fixed; inset: 0;
      z-index: 1100;
      backdrop-filter: blur(8px);
      background: rgba(0,0,0,.92);
    }
    #modal.behind-confirm { backdrop-filter: blur(5px); }
    .modal {
      background: var(--s1); border: 1px solid var(--bd);
      border-radius: 12px; max-width: 90vw; max-height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; padding: 12px 16px;
      border-bottom: 1px solid var(--bd); gap: 12px;
    }
    .modal-header .title {
      flex: 1; font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .modal-header .close {
      background: none; border: none; color: var(--dm);
      font-size: 18px; cursor: pointer; padding: 0 4px;
    }
    .modal-header .close:hover { color: var(--tx) }
    .modal-body {
      flex: 1; overflow: auto; display: flex;
      align-items: center; justify-content: center;
      padding: 0;
    }
    .modal-body img {
      max-width: 100%; max-height: 70vh; object-fit: contain;
    }
    .modal-body video {
      max-width: 100%; max-height: 70vh; outline: none;
    }
    .preview-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: blur(12px);
      opacity: 1;
      transition: opacity 0.3s;
    }
    .preview-thumb.hidden { opacity: 0 }
    .preview-full {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .preview-full.loaded { opacity: 1 }
    .preview-spinner {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid var(--bd);
      border-top-color: var(--ac);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 10;
    }
    .preview-spinner.hidden { display: none }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .modal-footer {
      display: flex; padding: 10px 16px; gap: 8px;
      border-top: 1px solid var(--bd);
    }
    .modal-footer .info {
      flex: 1; font-size: 11px; color: var(--dm);
      display: flex; align-items: center;
    }
    .modal-footer .btn {
      padding: 6px 16px; border-radius: 8px; font-size: 11px;
      font-weight: 600; cursor: pointer; border: 1px solid var(--bd);
      background: none; color: var(--tx); transition: all .2s;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .modal-footer .btn:hover { border-color: var(--ac); color: var(--ac) }
    .modal-footer .btn.primary { background: var(--ac); border-color: var(--ac); color: #fff }
    .modal-footer .btn.primary:hover { background: var(--ac2) }
    .modal-footer .btn.danger { border-color: var(--er); color: var(--er) }
    .modal-footer .btn.danger:hover { background: var(--er); color: #fff }
    #modalDownload { border-color: var(--ac); color: var(--ac); text-decoration: none }
    #modalDownload:hover { background: var(--ac); color: #fff }
    .modal.confirm { max-width: 360px; width: 90%; }
    #confirmBody { padding: 20px; font-size: 13px; color: var(--tx); text-align: center; }
    #confirmOk {
      margin-left: 8px;
      background: var(--er); border-color: var(--er); color: #fff;
    }
    #confirmOk:hover { background: #ff4455 }
    #confirmCancel { border-color: var(--ac); color: var(--ac) }
    #confirmCancel:hover { background: var(--ac); color: #fff }
    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--dm);
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; opacity: .5 }
    .empty .msg { font-size: 14px; font-weight: 600 }
    .empty .sub { font-size: 12px; margin-top: 4px; opacity: .6 }
    .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .detail-table td { padding: 8px 16px; border-bottom: 1px solid var(--bd); word-break: break-all; }
    .detail-table td:first-child { color: var(--dm); width: 110px; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
    #toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--s1); border: 1px solid var(--ac); color: var(--tx);
      padding: 8px 18px; border-radius: 20px; font-size: 12px; z-index: 2000;
      opacity: 0; transition: all .25s; pointer-events: none; box-shadow: 0 0 16px var(--gl);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { border-color: var(--er); }
    .add-label { font-size: 10px; font-weight: 700; color: var(--dm); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .add-field { background: var(--bg); border: 1px solid var(--bd); color: var(--tx); padding: 6px 10px; border-radius: 8px; font-size: 12px; outline: none; width: 100%; }
    .add-field:focus { border-color: var(--ac) }
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px }
      .gallery { padding: 10px 12px }
      .filter-bar { flex-wrap: wrap; height: auto; min-height: 44px; padding: 4px 12px; gap: 6px }
      .filter-bar label { font-size: 9px }
      .filter-bar select { max-width: 120px; padding: 3px 6px }
      nav { padding: 0 12px }
      .status { display: none }
      nav .tab { display: none }
      .mobile-filter-btn { display: inline-block }
    }
</style>
</head>
<body>
<nav>
  <div class='logo'>Plugins Mgr<span class='version'>v1.1 :4002</span></div>
  <button class='tab active' data-tab='all'>All</button>
  <button class='tab' data-tab='enabled'>Enabled</button>
  <button class='tab' data-tab='disabled'>Disabled</button>
  <button class='tab' data-tab='unlisted'>Unlisted</button>
  <button class='mobile-filter-btn' id='mobileFilter'>Filter</button>
  <div class='spacer'></div>
  <div class='status' id='status'><span>0</span> files</div>
  <button class='shut' id='stopBtn' title='Stop server'>
    <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M18.36 6.64a9 9 0 1 1-12.72 0'/><line x1='12' y1='2' x2='12' y2='12'/></svg>
    Stop
  </button>
</nav>
<div class='filter-bar'>
  <label>Section</label>
  <select id='sectFilter'><option value=''>All sections</option></select>
  <button class='sort-btn' id='sortBtn' title='Toggle sort'>A-Z</button>
  <input type='text' id='search' placeholder='Search files...'>
  <div class='view-toggle'>
    <button class='sort-btn' id='viewGrid' title='Grid view'>Grid</button>
    <button class='sort-btn' id='viewList' title='List view'>List</button>
  </div>
  <button class='sort-btn' id='selectAllBtn' title='Select/unselect all filtered'>Select all</button>
  <button class='sort-btn' id='uploadBtn' title='Upload file'>+ Upload</button>
  <button class='sort-btn' id='addBtn' title='Add ini entry'>+ Entry</button>
  <div class='count' id='count'>showing <span>0</span></div>
</div>
<div class='sel-bar' id='selBar'>
  <div class='count-label'><span id='selCount'>0</span> selected</div>
  <button class='sort-btn dl' id='selDownload' title='Download selected'>Download</button>
  <button class='sort-btn del' id='selDelete' title='Delete selected'>Delete</button>
  <button class='sort-btn clear' id='selClear' title='Clear selection'>Clear</button>
</div>
<div class='gallery' id='gallery'><div class='grid' id='grid'></div><div class='list' id='list'></div><div class='empty' id='empty' style='display:none'>
  <div class='icon'>&#9673;</div>  <div class='msg'>No files found</div>
  <div class='sub'>Upload a file or add an entry to plugins.ini</div>
</div></div>
<input type='file' id='fileInput' style='display:none'>
<div class='modal-overlay' id='modal'><div class='modal' style='max-width:520px;width:90%'>
  <div class='modal-header'><div class='title' id='modalTitle'></div>
  <button class='close' id='modalClose'>&times;</button></div>
  <div class='modal-body' style='display:block;padding:8px 0'><table class='detail-table' id='detailTable'></table></div>
  <div class='modal-footer'><div class='info' id='modalInfo'></div>
    <button class='btn danger' id='modalDelete'>Delete</button>
    <button class='btn primary' id='modalToggle'>Toggle</button>
  </div>
</div></div>
<div class='modal-overlay' id='confirmModal'><div class='modal confirm'>
  <div class='modal-header'><div class='title'>Confirm</div></div>
  <div id='confirmBody'></div>
  <div class='modal-footer'><div class='info'></div>
    <button class='btn' id='confirmCancel'>Cancel</button>
    <button class='btn danger' id='confirmOk'>OK</button>
  </div>
</div></div>
<div class='modal-overlay' id='addModal'><div class='modal' style='max-width:420px;width:90%'>
  <div class='modal-header'><div class='title'>Add plugin entry</div>
  <button class='close' id='addClose'>&times;</button></div>
  <div class='modal-body' style='display:block;padding:14px 16px'>
    <div style='margin-bottom:10px'><div class='add-label'>Section</div><select id='addSection' class='add-field'></select></div>
    <div id='addNewWrap' style='display:none;margin-bottom:10px'><div class='add-label'>New section</div><input type='text' id='addNewSection' class='add-field' placeholder='CUSA00001'></div>
    <div style='margin-bottom:10px'><div class='add-label'>Pick from files on disk</div><select id='addPick' class='add-field'><option value=''>-- or type filename below --</option></select></div>
    <div style='margin-bottom:10px'><div class='add-label'>Filename + extension</div><input type='text' id='addFilename' class='add-field' placeholder='my_plugin.prx'></div>
    <div style='font-size:11px;color:var(--dm);word-break:break-all' id='addPreview'>/data/GoldHEN/plugins/...</div>
  </div>
  <div class='modal-footer'><div class='info'>path is filled in automatically</div>
    <button class='btn' id='addCancel'>Cancel</button>
    <button class='btn primary' id='addOk'>Add</button>
  </div>
</div></div>
<div id='toast'></div>
<script>
var S={sections:[],files:[],tab:'all',sect:'',q:'',asc:true,sel:null,view:(window.innerWidth>=768)?'list':'grid',selected:{}};
var $=function(id){return document.getElementById(id);};
function toast(m,e){var t=$('toast');t.textContent=m;t.className=e?'show err':'show';setTimeout(function(){t.className='';},2200);}
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(2)+' MB';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function allEntries(){var r=[];S.sections.forEach(function(s){s.entries.forEach(function(e){r.push({section:s.id,path:e.path,file:e.file,enabled:e.enabled});});});return r;}
function fileInfo(n){for(var i=0;i<S.files.length;i++)if(S.files[i].name===n)return S.files[i];return null;}
function selectedNames(){var out=[];for(var k in S.selected)if(S.selected[k])out.push(k);return out;}
function syncSelUI(){
  var n=selectedNames().length;
  $('selBar').classList.toggle('show',n>0);
  $('selCount').textContent=n;
  var rows=document.querySelectorAll('.card,.list-row');
  for(var i=0;i<rows.length;i++){var nm=rows[i].getAttribute('data-name');if(nm)rows[i].classList.toggle('selected',!!S.selected[nm]);}
  var boxes=document.querySelectorAll('.sel-box,.row-check');
  for(var j=0;j<boxes.length;j++){var fn=boxes[j].getAttribute('data-file');if(fn)boxes[j].checked=!!S.selected[fn];}
}
function setSel(name,on){if(on)S.selected[name]=true;else delete S.selected[name];syncSelUI();}
function clearSel(){S.selected={};syncSelUI();}
async function load(){try{var r=await fetch('/api/plugins');var j=await r.json();S.sections=j.sections||[];S.files=j.files||[];buildSect();buildAddPick();render();}catch(e){toast('Failed to load plugins',1);}}
function buildSect(){var s=$('sectFilter');var cur=s.value;s.innerHTML='<option value="">All sections</option>';S.sections.forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.id+' ('+x.entries.length+')';s.appendChild(o);});s.value=cur;}
function buildAddPick(){var p=$('addPick');var cur=p.value;p.innerHTML='<option value="">-- or type filename below --</option>';S.files.forEach(function(f){var o=document.createElement('option');o.value=f.name;o.textContent=f.name;p.appendChild(o);});p.value=cur;}
function filtered(){var es=allEntries();var out=[];
  if(S.tab==='unlisted'){S.files.forEach(function(f){out.push({section:'',path:'/data/GoldHEN/plugins/'+f.name,file:f.name,enabled:false,unlisted:true});});}
  else{es.forEach(function(e){if(S.tab==='enabled'&&!e.enabled)return;if(S.tab==='disabled'&&e.enabled)return;out.push(e);});}
  if(S.sect)out=out.filter(function(e){return e.section===S.sect;});
  if(S.q)out=out.filter(function(e){return e.file.toLowerCase().indexOf(S.q)>=0||e.path.toLowerCase().indexOf(S.q)>=0;});
  out.sort(function(a,b){return S.asc?a.file.localeCompare(b.file):b.file.localeCompare(a.file);});
  return out;}
function badge(e){if(e.unlisted)return "<span class='type-badge photo'>unlisted</span>";return e.enabled?"<span class='type-badge on'>on</span>":"<span class='type-badge off'>off</span>";}
var PUZZLE="<svg viewBox='0 0 24 24'><path d='M14 7V5a2 2 0 0 0-4 0v2H7a2 2 0 0 0-2 2v3h2a2 2 0 1 1 0 4H5v3a2 2 0 0 0 2 2h3v-2a2 2 0 1 1 4 0v2h3a2 2 0 0 0 2-2v-3h-2a2 2 0 1 1 0-4h2V9a2 2 0 0 0-2-2h-3z'/></svg>";
var TRASH="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 6h18M8 6V4h8v2m1 0v14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6'/><line x1='10' y1='11' x2='10' y2='17'/><line x1='14' y1='11' x2='14' y2='17'/></svg>";
function render(){var list=filtered();var g=$('grid'),l=$('list');
  g.innerHTML='';l.innerHTML='';
  $('empty').style.display=list.length?'none':'flex';
  $('count').innerHTML='showing <span>'+list.length+'</span>';
  var n=allEntries().length;$('status').innerHTML='<span>'+n+'</span> plugins';
  $('gallery').classList.toggle('list-mode',S.view==='list');
  var host=S.view==='list'?l:g;
  list.forEach(function(e){renderItem(host,e);});
  syncSelUI();}
function renderItem(el,e){var f=fileInfo(e.file);var sz=f?fmtSize(f.size):'missing';
  var d=document.createElement('div');
  if(S.view==='list'){
    d.className='list-row'+(e.enabled?' enabled':'');
    d.setAttribute('data-name',e.file);
    d.innerHTML="<input type='checkbox' class='row-check' data-file='"+esc(e.file)+"'><div class='row-icon'>"+PUZZLE+"</div><div class='row-name'><div class='row-title'>"+esc(e.file)+"</div><div class='row-sub'>"+esc(e.section||'disk')+" "+badge(e)+"</div></div><div class='row-meta'>"+sz+"</div><div class='row-actions'><button class='card-btn dl'>"+(e.unlisted?'Add':(e.enabled?'Disable':'Enable'))+"</button><button class='card-btn'>Details</button><button class='card-btn del'>"+TRASH+"</button></div>";
  } else {
    d.className='card'+(e.enabled?' enabled':'');
    d.setAttribute('data-name',e.file);
    d.innerHTML="<input type='checkbox' class='sel-box' data-file='"+esc(e.file)+"'><div class='card-thumb'>"+PUZZLE+"</div><div class='card-info'><div class='card-title'>"+esc(e.file)+"</div><div class='card-meta'><span>"+esc(e.section||'disk')+"</span><span>"+sz+"</span></div><div style='margin-top:4px'>"+badge(e)+"</div><div class='card-actions'><button class='card-btn dl'>"+(e.unlisted?'Add':(e.enabled?'Disable':'Enable'))+"</button><button class='card-btn'>Details</button><button class='card-btn del'>"+TRASH+"</button></div></div>";
  }
  var btns=d.querySelectorAll('.card-btn');
  btns[0].onclick=function(ev){ev.stopPropagation();if(e.unlisted)openAddModal('default',e.file);else toggle(e);};
  btns[1].onclick=function(ev){ev.stopPropagation();openModal(e);};
  btns[2].onclick=function(ev){ev.stopPropagation();askDelete(e);};
  var box=d.querySelector('.sel-box,.row-check');
  box.onclick=function(ev){ev.stopPropagation();setSel(e.file,box.checked);};
  d.onclick=function(){openModal(e);};
  el.appendChild(d);}
function toggleSelectAll(){
  var list=filtered();
  if(!list.length)return;
  var allOn=list.every(function(e){return S.selected[e.file];});
  list.forEach(function(e){if(allOn)delete S.selected[e.file];else S.selected[e.file]=true;});
  render();}
function downloadSelected(){
  var names=selectedNames();
  if(!names.length){toast('Nothing selected',1);return;}
  if(names.length===1){
    var a=document.createElement('a');
    a.href='/api/download?name='+encodeURIComponent(names[0]);
    a.download=names[0];
    document.body.appendChild(a);a.click();a.remove();
    return;
  }
  toast('Packing '+names.length+' files into zip...');
  fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names:names.join(',')})})
    .then(function(r){if(!r.ok)throw new Error('failed');return r.blob();})
    .then(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download='plugins-mgr.zip';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
      toast('Downloading plugins-mgr.zip');
    })
    .catch(function(){toast('Zip download failed',1);});
}
function askDeleteSelected(){
  var names=selectedNames();
  if(!names.length){toast('Nothing selected',1);return;}
  var shown=names.slice(0,3).join(', ');
  var msg='Delete '+names.length+' file'+(names.length>1?'s':'')+'? '+shown+(names.length>3?' +'+(names.length-3)+' more':'')+' — files and ini refs are removed.';
  confirmBox(msg,async function(){
    var j=await post('/api/files',{names:names.join(','),clean_ini:'true'});
    if(j.ok){toast('Deleted '+j.deleted+' file'+(j.deleted===1?'':'s'));clearSel();closeModal();load();}
    else toast(j.error||'Delete failed',1);});}
async function post(url,body){var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json();}
async function toggle(e){var j=await post('/api/toggle',{section:e.section,path:e.path});if(j.ok){toast('Toggled '+e.file);load();}else toast(j.error||'Toggle failed',1);}
function openAddModal(section,file){
  var sel=$('addSection'), newWrap=$('addNewWrap');
  sel.innerHTML='<option value="">-- select a section --</option>';
  S.sections.forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.id;sel.appendChild(o);});
  if(section && S.sections.some(function(x){return x.id===section;})) sel.value=section;
  if(file) $('addFilename').value=file;
  newWrap.style.display='none';
  updateAddPreview();
  $('addModal').classList.add('active');
}
function updateAddPreview(){
  var filename=$('addFilename').value.trim();
  var section=$('addSection').value || $('addNewSection').value.trim();
  $('addPreview').textContent=section && filename ? '/data/GoldHEN/plugins/'+filename : '/data/GoldHEN/plugins/...';
}
async function addEntryFromModal(){
  var filename=$('addFilename').value.trim();
  var section=$('addSection').value || $('addNewSection').value.trim();
  if(!filename){toast('Enter a filename + extension',1);return;}
  if(filename.indexOf('/')>=0 || filename.indexOf('\\')>=0 || filename.indexOf('..')>=0){toast('Invalid filename',1);return;}
  if(!section){toast('Select or create a section',1);return;}
  var j=await post('/api/entry',{section:section,path:'/data/GoldHEN/plugins/'+filename,op:'add'});
  if(j.ok){toast(j.exists?'Already exists':'Entry added');closeAddModal();load();}
  else toast(j.error||'Add failed',1);
}
function closeAddModal(){$('addModal').classList.remove('active');}
function askDelete(e){confirmBox('Delete '+e.file+'? File + ini refs are removed.',async function(){
  var j=await post('/api/file',{name:e.file,op:'delete',clean_ini:true});
  if(j.ok){toast('Deleted '+e.file);closeModal();load();}else toast(j.error||'Delete failed',1);});}
var confirmCb=null;
function confirmBox(msg,cb){$('confirmBody').textContent=msg;confirmCb=cb;$('confirmModal').classList.add('active');$('modal').classList.add('behind-confirm');}
$('confirmOk').onclick=function(){$('confirmModal').classList.remove('active');$('modal').classList.remove('behind-confirm');if(confirmCb)confirmCb();};
$('confirmCancel').onclick=function(){$('confirmModal').classList.remove('active');$('modal').classList.remove('behind-confirm');};
function openModal(e){S.sel=e;var f=fileInfo(e.file);
  $('modalTitle').textContent=e.file;
  $('detailTable').innerHTML='<tr><td>Path</td><td>'+esc(e.path)+'</td></tr><tr><td>Section</td><td>'+esc(e.section||'(file only)')+'</td></tr><tr><td>State</td><td>'+(e.unlisted?'unlisted (not in ini)':(e.enabled?'enabled':'disabled'))+'</td></tr><tr><td>Size</td><td>'+(f?fmtSize(f.size):'not on disk')+'</td></tr>';
  $('modalInfo').textContent=e.section?e.section+' :: '+e.file:'on disk only';
  $('modalToggle').textContent=e.enabled?'Disable':'Enable';
  $('modal').classList.add('active');}
function closeModal(){$('modal').classList.remove('active');}
$('modalClose').onclick=closeModal;
$('modal').onclick=function(e){if(e.target===$('modal'))closeModal();};
$('modalToggle').onclick=function(){if(!S.sel)return;var e=S.sel;closeModal();if(e.unlisted)openAddModal(e.section||'default',e.file);else toggle(e);};
$('modalDelete').onclick=function(){if(!S.sel)return;var e=S.sel;askDelete(e);};
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');S.tab=t.getAttribute('data-tab');render();};});
$('mobileFilter').onclick=function(){var tabs=['all','enabled','disabled','unlisted'];var i=(tabs.indexOf(S.tab)+1)%tabs.length;S.tab=tabs[i];document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-tab')===S.tab);});toast('Filter: '+S.tab);render();};
$('sectFilter').onchange=function(e){S.sect=e.target.value;render();};
$('search').oninput=function(e){S.q=e.target.value.toLowerCase();render();};
$('sortBtn').onclick=function(){S.asc=!S.asc;$('sortBtn').textContent=S.asc?'A-Z':'Z-A';render();};
$('addBtn').onclick=function(){openAddModal('default','');};
$('addClose').onclick=closeAddModal;
$('addCancel').onclick=closeAddModal;
$('addOk').onclick=addEntryFromModal;
$('addSection').onchange=function(){$('addNewWrap').style.display=$('addSection').value?'none':'block';updateAddPreview();};
$('addNewSection').oninput=updateAddPreview;
$('addFilename').oninput=updateAddPreview;
$('addPick').onchange=function(){if(this.value)$('addFilename').value=this.value;updateAddPreview();};
$('sectFilter').onchange=function(e){S.sect=e.target.value;render();};
$('search').oninput=function(e){S.q=e.target.value.toLowerCase();render();};
$('sortBtn').onclick=function(){S.asc=!S.asc;$('sortBtn').textContent=S.asc?'A-Z':'Z-A';render();};
$('addBtn').onclick=function(){openAddModal('default','');};
$('uploadBtn').onclick=function(){$('fileInput').click();};
function setView(v){S.view=v;$('viewGrid').classList.toggle('active',v==='grid');$('viewList').classList.toggle('active',v==='list');render();}
$('viewGrid').onclick=function(){setView('grid');};
$('viewList').onclick=function(){setView('list');};
setView(S.view);
$('selectAllBtn').onclick=toggleSelectAll;
$('selDownload').onclick=downloadSelected;
$('selDelete').onclick=askDeleteSelected;
$('selClear').onclick=clearSel;
$('fileInput').onchange=async function(){var f=$('fileInput').files[0];if(!f)return;
  toast('Uploading '+f.name+'...');
  try{var r=await fetch('/api/upload?filename='+encodeURIComponent(f.name),{method:'POST',body:f});var j=await r.json();if(j.ok){toast('Uploaded '+f.name);load();}else toast(j.error||'Upload failed',1);}catch(e){toast('Upload failed',1);}
  $('fileInput').value='';};
$('stopBtn').onclick=function(){confirmBox('Stop the Plugins Mgr server?',async function(){try{await fetch('/api/stop',{method:'POST'});toast('Server stopped');}catch(e){toast('Server stopped');}});};
load();
</script>
</body>
